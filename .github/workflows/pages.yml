name: Deploy Website & Sparkle Appcast to GitHub Pages

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pages/**'
      - '.github/workflows/pages.yml'
      - 'docs/**'
      - 'scripts/verify-website.py'

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stage website and static assets
        run: |
          set -euo pipefail
          mkdir -p site/docs site/Resources

          if [ -d pages ]; then
            cp -R pages/. site/
          fi

          # Current, audited product captures and accessible trailer captions.
          for asset in docs/menu-navigation-*.png docs/widget-showcase.png docs/loom-2.0-poster.png docs/loom-2.0-notifications.png docs/loom-2.0-captions.vtt; do
            test -s "$asset"
            cp "$asset" site/docs/
          done

          if [ -f Resources/LoomIconMaster.png ]; then
            cp Resources/LoomIconMaster.png site/Resources/
          fi

          touch site/.nojekyll

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # 1. Resolve current published app release for Sparkle update feed
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          if [[ -z "${RELEASE_TAG}" ]]; then
            RELEASE_TAG="$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName 2>/dev/null || gh release list --repo "${{ github.repository }}" --limit 1 | awk '{print $3}')"
          fi
          echo "Target app release for appcast: ${RELEASE_TAG:-latest}"

          echo "Downloading appcast.xml from current release (${RELEASE_TAG:-latest})..."
          if [[ -n "${RELEASE_TAG}" ]]; then
            gh release download "${RELEASE_TAG}" --repo "${{ github.repository }}" --pattern "appcast.xml" --dir site --clobber
          else
            gh release download --repo "${{ github.repository }}" --pattern "appcast.xml" --dir site --clobber
          fi

          # 2. Download promotional demo videos from the current media release (override PROMO_RELEASE_TAG when needed)
          PROMO_RELEASE_TAG="${PROMO_RELEASE_TAG:-v2.0.0}"
          echo "Downloading promotional videos from release ${PROMO_RELEASE_TAG}..."
          for video in "Loom-Demo-16x9.mp4" "Loom-Demo-9x16.mp4"; do
            echo "Fetching ${video} from ${PROMO_RELEASE_TAG}..."
            gh release download "${PROMO_RELEASE_TAG}" --repo "${{ github.repository }}" --pattern "${video}" --dir site --clobber
          done

          # 3. Fallback minimal page only if pages/index.html was not provided
          if [[ ! -f site/index.html ]]; then
            echo "Generating fallback index.html..."
            python3 -c '
            import textwrap
            html = """<!DOCTYPE html>
            <html lang="en">
            <head>
              <meta charset="utf-8">
              <title>Loom — Software Updates</title>
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <style>
                body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f1117; color: #f0f2f5; margin: 0; padding: 40px 20px; display: flex; justify-content: center; align-items: center; min-height: 80vh; }
                .card { background: #1a1d26; border: 1px solid #2d313e; border-radius: 12px; max-width: 540px; width: 100%; padding: 32px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
                h1 { margin-top: 0; font-size: 24px; color: #ffffff; }
                p { line-height: 1.6; color: #9da5b4; }
                a.button { display: inline-block; background: #2563eb; color: #ffffff; padding: 10px 18px; border-radius: 8px; text-decoration: none; font-weight: 500; margin-top: 12px; margin-right: 10px; }
                a.button:hover { background: #1d4ed8; }
                a.secondary { display: inline-block; background: #2d313e; color: #e2e8f0; padding: 10px 18px; border-radius: 8px; text-decoration: none; font-weight: 500; margin-top: 12px; }
                a.secondary:hover { background: #373c4c; }
                code { background: #282c37; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 13px; color: #38bdf8; }
              </style>
            </head>
            <body>
              <div class="card">
                <h1>Loom Updates Feed</h1>
                <p>This is the official Sparkle 2 appcast feed distribution server for <strong>Loom</strong>, the native macOS monitor for local AI coding agents.</p>
                <p>Sparkle Feed URL: <code>https://chaiwithcode.github.io/Loom/appcast.xml</code></p>
                <div>
                  <a class="button" href="https://github.com/chaiwithcode/Loom/releases">GitHub Releases</a>
                  <a class="secondary" href="appcast.xml">View appcast.xml</a>
                </div>
              </div>
            </body>
            </html>
            """
            with open("site/index.html", "w") as f:
                f.write(textwrap.dedent(html).strip() + "\n")
            '
          fi

          # 4. Strict validation: fail deployment if any required asset is missing or empty
          echo "Validating required site assets..."
          REQUIRED_ASSETS=(
            "site/appcast.xml"
            "site/Loom-Demo-16x9.mp4"
            "site/Loom-Demo-9x16.mp4"
            "site/index.html"
            "site/style.css"
          )

          for asset in "${REQUIRED_ASSETS[@]}"; do
            if [[ ! -f "${asset}" ]]; then
              echo "::error::Required deployment asset '${asset}' is missing!" >&2
              exit 1
            fi
            if [[ ! -s "${asset}" ]]; then
              echo "::error::Required deployment asset '${asset}' is empty (0 bytes)!" >&2
              exit 1
            fi
            echo "Verified asset: ${asset} ($(wc -c < "${asset}" | tr -d ' ') bytes)"
          done

      - name: Verify website references
        run: python3 scripts/verify-website.py site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
