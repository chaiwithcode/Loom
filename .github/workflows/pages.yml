name: Deploy Sparkle Appcast to GitHub Pages

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-appcast:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download appcast from latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p pages

          TAG="${{ github.event.release.tag_name }}"
          if [[ -z "${TAG}" ]]; then
            TAG="$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName 2>/dev/null || gh release list --repo "${{ github.repository }}" --limit 1 | awk '{print $3}')"
          fi
          echo "Fetching appcast.xml for release ${TAG}..."
          gh release download "${TAG}" --repo "${{ github.repository }}" --pattern "appcast.xml" --dir pages || {
            echo "Warning: appcast.xml not found in release asset."
          }

          python3 -c '
          import textwrap
          html = """<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>Loom — Software Updates</title>
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f1117; color: #f0f2f5; margin: 0; padding: 40px 20px; display: flex; justify-content: center; align-items: center; min-height: 80vh; }
              .card { background: #1a1d26; border: 1px solid #2d313e; border-radius: 12px; max-width: 540px; width: 100%; padding: 32px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
              h1 { margin-top: 0; font-size: 24px; color: #ffffff; }
              p { line-height: 1.6; color: #9da5b4; }
              a.button { display: inline-block; background: #2563eb; color: #ffffff; padding: 10px 18px; border-radius: 8px; text-decoration: none; font-weight: 500; margin-top: 12px; margin-right: 10px; }
              a.button:hover { background: #1d4ed8; }
              a.secondary { display: inline-block; background: #2d313e; color: #e2e8f0; padding: 10px 18px; border-radius: 8px; text-decoration: none; font-weight: 500; margin-top: 12px; }
              a.secondary:hover { background: #373c4c; }
              code { background: #282c37; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 13px; color: #38bdf8; }
            </style>
          </head>
          <body>
            <div class="card">
              <h1>Loom Updates Feed</h1>
              <p>This is the official Sparkle 2 appcast feed distribution server for <strong>Loom</strong>, the native macOS monitor for local AI coding agents.</p>
              <p>Sparkle Feed URL: <code>https://chaiwithcode.github.io/Loom/appcast.xml</code></p>
              <div>
                <a class="button" href="https://github.com/chaiwithcode/Loom/releases">GitHub Releases</a>
                <a class="secondary" href="appcast.xml">View appcast.xml</a>
              </div>
            </div>
          </body>
          </html>
          """
          with open("pages/index.html", "w") as f:
              f.write(textwrap.dedent(html).strip() + "\n")
          '

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
