name: macOS checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and package
        run: bash scripts/build-app.sh
      # The discovery smoke test requires a local Antigravity installation/store.
      # Keep test in source; this job does not claim live-database coverage.
      - name: Portable tests (live Antigravity discovery excluded)
        run: swift test --disable-sandbox --skip 'testRealAntigravityDiscoverySmokeTest'
      - name: Dedicated regression tests
        run: swift test --disable-sandbox --filter 'LoomRegressionTests.*'
      - name: Verify release and pages pipeline
        run: |
          bash scripts/verify-release-pipeline.sh
          bash scripts/verify-pages-staging.sh
      - name: Package development artifact
        run: |
          set -euo pipefail
          ARCH="$(uname -m)"
          mkdir -p .build/artifacts
          ZIP_NAME="Loom-development-${ARCH}.zip"
          ZIP_PATH=".build/artifacts/${ZIP_NAME}"
          ditto -c -k --keepParent .build/Loom.app "${ZIP_PATH}"
          (cd .build/artifacts && shasum -a 256 "${ZIP_NAME}" > "${ZIP_NAME}.sha256")
      - name: Upload development build
        uses: actions/upload-artifact@v4
        with:
          name: Loom-development-macos-15-${{ runner.arch }}
          path: |
            .build/artifacts/*.zip
            .build/artifacts/*.sha256
          if-no-files-found: error
          retention-days: 14
