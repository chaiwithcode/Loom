name: macOS checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and package
        run: bash scripts/build-app.sh
      # The discovery smoke test requires a local Antigravity installation/store.
      # Keep test in source; this job does not claim live-database coverage.
      - name: Portable tests (live Antigravity discovery excluded)
        run: swift test --disable-sandbox --skip 'testRealAntigravityDiscoverySmokeTest'
